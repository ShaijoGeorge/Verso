name: verso
description: "A modern, Bible tracking application."
version: 2.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  collection: ^1.18.0
  connectivity_plus: ^6.1.4
  drift: ^2.22.1
  drift_flutter: ^0.2.4
  fl_chart: ^1.1.1
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_local_notifications: ^21.0.0
  flutter_riverpod: ^3.0.3
  flutter_timezone: ^5.0.2
  gap: ^3.0.0
  go_router: ^17.0.0
  google_fonts: ^8.0.2
  intl: ^0.20.2
  package_info_plus: ^9.0.0
  riverpod_annotation: ^4.0.0
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  supabase_flutter: ^2.3.0
  timezone: ^0.11.0

dev_dependencies:
  analyzer: ^8.4.1
  build_runner: ^2.4.8
  drift_dev: ^2.22.1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.0+1
  very_good_analysis: ^10.1.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/app_logo.png


flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/app_logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/app_logo.png"
    background_color: "#0175C2"
    theme_color: "#0175C2"
