# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# very_good_analysis is a strict ruleset — great for packages, but some rules
# are intentionally disabled here because this is an *application* codebase.
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:very_good_analysis/analysis_options.yaml

linter:
  rules:
    # ----- Rules too strict for an application (not a published package) -----

    # Requiring doc-comments on every public widget/class creates maintenance
    # overhead with no benefit in a single-team app codebase.
    public_member_api_docs: false

    # 80-char line limit is a convention for package documentation; apps run
    # on wide monitors and benefit from readable, non-wrapped code.
    lines_longer_than_80_chars: false

    # Positional booleans are common in Flutter callbacks (e.g. onChanged(bool)).
    avoid_positional_boolean_parameters: false

    # `unawaited()` wrapper is verbose for fire-and-forget UI navigation calls.
    unawaited_futures: false
    discarded_futures: false

    # Bare `catch` clauses are sometimes appropriate (error boundary, logging).
    avoid_catches_without_on_clauses: false

    # Cascade style is a preference, not a correctness issue.
    cascade_invocations: false

    # Catching TypeError is intentional in certain data-parsing paths.
    avoid_catching_errors: false

    # `mounted` is the Flutter-recommended guard before using BuildContext
    # after an async gap. Disabling to avoid false positives on that pattern.
    use_build_context_synchronously: false

    # document_ignores requires explanatory comments above every ignore: directive,
    # which is excessive overhead for a single-team application codebase.
    document_ignores: false
